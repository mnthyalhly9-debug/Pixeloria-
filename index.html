    <!-- نافذة تسجيل الدخول / إنشاء حساب -->
    <div id="auth-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 id="modal-title" style="font-size: 20px; font-weight: 700; color: #111;">Sign in to Pixeloria</h3>
                <button onclick="document.getElementById('auth-modal').style.display='none'" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #666;">✕</button>
            </div>
            
            <form id="auth-form" style="display: flex; flex-direction: column; gap: 15px;">
                <div id="name-field" style="display: none;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px;">Full Name</label>
                    <input type="text" placeholder="Your Name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;">
                </div>
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px;">Email Address</label>
                    <input type="email" placeholder="name@example.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;" required>
                </div>
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px;">Password</label>
                    <input type="password" placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;" required>
                </div>
                <button type="submit" id="submit-btn" style="background: #6c5ce7; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px;">Sign In</button>
            </form>
            
            <div style="text-align: center; margin-top: 15px; font-size: 13px; color: #666;">
                <span id="switch-text">Don't have an account?</span> 
                <a href="#" onclick="toggleAuthMode(event)" id="switch-link" style="color: #6c5ce7; text-decoration: none; font-weight: 600;">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        let isSignUp = false;
        function openAuth(signUp) {
            isSignUp = signUp;
            document.getElementById('auth-modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = isSignUp ? 'Create a Pixeloria Account' : 'Sign in to Pixeloria';
            document.getElementById('submit-btn').innerText = isSignUp ? 'Create Account' : 'Sign In';
            document.getElementById('name-field').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('switch-text').innerText = isSignUp ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('switch-link').innerText = isSignUp ? 'Sign in' : 'Sign up';
        }
        function toggleAuthMode(e) {
            e.preventDefault();
            openAuth(!isSignUp);
        }
    </script>
