<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixeloria - متجر رقمي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fcfcfc; color: #1a1a1a; text-align: center; padding: 50px; }
        h1 { color: #6c5ce7; font-size: 32px; margin-bottom: 15px; }
        p { color: #555; font-size: 16px; margin-bottom: 25px; }
        .btn { background: #6c5ce7; color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <h1>منصة Pixeloria الرقمية</h1>
        <p>متجرك الرقمي قيد التشغيل بنجاح وجاهز لاستقبال التعديلات والمنتجات!</p>
        <button class="btn" onclick="alert('المتجر يعمل بكفاءة عالية!')">اضغط للتجربة</button>
    </div>
</body>
</html>
